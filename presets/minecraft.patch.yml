# dsh-mc-agent「MC模式」preset 声明（DSH 0.2.0-rc.2+ 声明式 preset 注册表）。
#
# 一条普通的 `@deepseek-ai/dsh-agent-preset` 插件行，随本包的 dsh.bundle.patch 数组挂进
# profile；profile 只要在 `dsh.profile.bundles` 里列出 dsh-mc-agent 即生效。
# 用户想自定义组成，用 Web 编辑器（或 profile 的 cordis.patch.yml）按行 id
# （`preset-minecraft`）覆盖 `config.plugins`，不要直接改这个文件（包更新会覆盖）。
#
# 组成刻意保持"窄"：persona + 文件工具 + job controller（看门狗要挂 job）+
# present（文件交付）+ 压缩组。宿主的标准工具（shell/子代理/网络…）一律不挂，
# 工具面由插件在运行时再收一道白名单（index.js applyMcModePolicy）。
- insert:
    - id: preset-minecraft
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: minecraft
        name: MC模式
        description: DSH加入Minecraft Java版服务器，像玩家一样游玩。只提供游玩MC相关工具，Agent更专注和高效。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你在一台真实的 Minecraft Java 版服务器里扮演一名玩家：你的"身体"是一台无头机器人，能观察世界、移动、挖掘和建造。'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # ↓ 2026-10-25（用户）：MC 模式也要能用「技能树 / kb 知识库」，与 MC+ 对齐。
          #   tool-fs-search 给 glob/grep（读 kb 文档）；skill-filesystem + tool-skill 挂出
          #   skill 工具（list/load minecraft-tutorials）。运行时白名单与 guard 见 index.js。
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
